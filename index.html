<style>
  :root{
    --void:#0E1116;
    --steel:#171C24;
    --steel2:#1E2530;
    --line:#262E39;
    --strap:#FF6B1A;
    --hiviz:#C8F031;
    --wa:#25D366;
    --mist:#E8ECF1;
    --slate:#8894A2;
    --alert:#FF4D4D;
    --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--void);color:var(--mist);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;
  }
  .eyebrow{font-family:"Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:12px;color:var(--slate)}
  .brand{font-family:"Barlow Condensed",Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:17px;line-height:1}
  .brand span{color:var(--strap)}

  /* ---------- telas ---------- */
  .screen{display:none;min-height:100dvh;flex-direction:column}
  .screen.on{display:flex}

  /* ---------- CAPA ---------- */
  #cover{
    align-items:center;justify-content:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    background:radial-gradient(120% 80% at 50% 0%, rgba(255,107,26,.10), transparent 60%),radial-gradient(90% 60% at 50% 100%, rgba(200,240,49,.06), transparent 60%),var(--void);
    cursor:pointer;position:relative;overflow:hidden;
  }
  .frame i{position:absolute;width:34px;height:34px;border:2px solid var(--line)}
  .frame i:nth-child(1){top:18px;left:18px;border-right:0;border-bottom:0}
  .frame i:nth-child(2){top:18px;right:18px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:18px;left:18px;border-right:0;border-top:0}
  .frame i:nth-child(4){bottom:18px;right:18px;border-left:0;border-top:0}
  #cover .brandlogo{width:min(70vw,320px);margin:0 0 22px;display:block}
  #cover .coverphoto{width:min(80vw,360px);border-radius:16px;margin:0 0 22px;display:block}
  #cover h1{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:clamp(34px,10vw,54px);margin:0;line-height:.95}
  #cover h1 span{color:var(--strap)}
  #cover .sub{color:var(--slate);margin-top:14px;font-size:15px;max-width:320px}
  .tap-cta{margin-top:30px;display:inline-flex;align-items:center;gap:10px;background:var(--strap);color:#1a0d04;font-weight:700;padding:14px 26px;border-radius:14px;font-size:16px;box-shadow:0 10px 30px rgba(255,107,26,.28)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .tap-cta{animation:pulse 2.2s ease-in-out infinite}

  /* ---------- barra superior ---------- */
  header.bar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) 12px;background:linear-gradient(180deg,rgba(14,17,22,.98),rgba(14,17,22,.86));position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .backbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--steel);color:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
  .backbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  header.bar .ttl{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.09em;font-weight:600;font-size:17px}
  header.bar .sub{font-size:11px;color:var(--slate);margin-top:2px}

  .content{flex:1;overflow:auto;padding:var(--pad);padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

  /* ---------- form ---------- */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:600;margin-bottom:8px}
  .field input{
    width:100%;background:var(--steel);border:1px solid var(--line);color:var(--mist);
    border-radius:14px;padding:16px 14px;font-size:17px;font-family:inherit;outline:none;
    transition:.15s;
  }
  .field input:focus{border-color:var(--strap);background:var(--steel2)}
  .field .hint{margin-top:6px;font-size:12px;color:var(--slate);min-height:16px}
  .field .hint.err{color:var(--alert)}
  .field .hint.ok{color:var(--hiviz)}
  .field .prefix{position:relative}
  .field .prefix input{padding-left:52px}
  .field .prefix span.p{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--slate);font-size:15px;font-weight:600;pointer-events:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .cnpj-info{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;display:none}
  .cnpj-info.on{display:block}
  .cnpj-info .rz{font-weight:700;font-size:15px;line-height:1.25}
  .cnpj-info .fa{font-size:13px;color:var(--slate);margin-top:3px}
  .cnpj-info .loc{margin-top:6px;font-size:13px;color:var(--hiviz);font-weight:600}
  .cnpj-info.loading{color:var(--slate);font-style:italic;font-size:13px;text-align:center}
  .cnpj-info.err{border-color:rgba(255,77,77,.4);color:var(--alert);font-size:13px}

  /* ---------- botões footer ---------- */
  .footbar{position:sticky;bottom:0;padding:12px var(--pad) calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(0deg,var(--void) 70%,rgba(14,17,22,0));display:flex;flex-direction:column;gap:10px}
  .btn{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--steel);color:var(--mist);font-size:16px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
  .btn.primary{background:var(--strap);border-color:var(--strap);color:#1a0d04}
  .btn.wa{background:var(--wa);border-color:var(--wa);color:#062a13}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn svg{width:20px;height:20px;fill:currentColor}

  /* ---------- overlay ---------- */
  .overlay{position:fixed;inset:0;background:rgba(14,17,22,.85);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;gap:14px;padding:24px;text-align:center}
  .overlay.on{display:flex}
  .spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--strap);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay .msg{color:var(--mist);font-weight:600;max-width:280px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--hiviz);color:#0E1116;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:.25s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{background:var(--alert);color:#fff}
</style>
</head>

  <h1>PREÇO DO<br><span>COMBUSTÍVEL</span></h1>
  <div class="sub">Informe o preço praticado do Diesel, Arla e o prazo de pagamento.</div>
  <div class="tap-cta">
    <span>INICIAR</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

<!-- ============ TELA 2: FORM ============ -->
<section class="screen" id="form">
  <header class="bar">
    <button class="backbtn" onclick="goCover()" aria-label="Voltar">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="ttl">Preço do Combustível</div>
      <div class="sub">Transportes ARI</div>
    </div>
  </header>

  <div class="content">
    <!-- CNPJ -->
    <div class="field">
      <label for="fCnpj">CNPJ</label>
      <input id="fCnpj" type="text" inputmode="numeric" autocomplete="off"
             placeholder="00.000.000/0000-00" maxlength="18"
             oninput="onCnpjInput(this)" onblur="onCnpjBlur()">
      <div class="hint" id="cnpjHint">Digite os 14 números do CNPJ.</div>
      <div class="cnpj-info" id="cnpjInfo"></div>
    </div>

    <!-- Valores Diesel + Arla -->
    <div class="row2">
      <div class="field">
        <label for="fDiesel">Valor do Diesel</label>
        <div class="prefix">
          <span class="p">R$</span>
          <input id="fDiesel" type="text" inputmode="numeric" placeholder="0,00"
                 oninput="onMoneyInput(this)" onfocus="this.select()">
        </div>
      </div>
      <div class="field">
        <label for="fArla">Valor do Arla</label>
        <div class="prefix">
          <span class="p">R$</span>
          <input id="fArla" type="text" inputmode="numeric" placeholder="0,00"
                 oninput="onMoneyInput(this)" onfocus="this.select()">
        </div>
      </div>
    </div>

    <!-- Prazo -->
    <div class="field">
      <label for="fPrazo">Prazo de pagamento (dias)</label>
      <input id="fPrazo" type="text" inputmode="numeric" placeholder="Ex.: 28" maxlength="4"
             oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)">
    </div>
  </div>

  <div class="footbar">
    <button class="btn primary" id="btnSave" onclick="salvarAri()">

      Salvar ARI
    </button>
    <button class="btn wa" id="btnShare" onclick="compartilharWhats()">
      <svg viewBox="0 0 24 24"><path d="M20.52 3.48A11.9 11.9 0 0012.06 0C5.5 0 .17 5.33.16 11.9c0 2.1.55 4.14 1.6 5.94L0 24l6.31-1.65a11.9 11.9 0 005.74 1.46h.01c6.55 0 11.88-5.33 11.89-11.9a11.86 11.86 0 00-3.44-8.43zM12.06 21.79h-.01a9.86 9.86 0 01-5.03-1.38l-.36-.21-3.74.98 1-3.65-.23-.37a9.86 9.86 0 01-1.51-5.26c0-5.46 4.44-9.9 9.89-9.9 2.64 0 5.13 1.03 6.99 2.9a9.83 9.83 0 012.9 6.99c0 5.46-4.44 9.9-9.9 9.9zm5.43-7.42c-.3-.15-1.76-.87-2.03-.97s-.47-.15-.67.15c-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48a9.05 9.05 0 01-1.67-2.07c-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/></svg>
      Compartilhar via WhatsApp
    </button>
  </div>
</section>

<div class="overlay" id="ovl"><div class="spinner"></div><div class="msg" id="ovlMsg">Carregando…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ========== CONFIG ========== */
const DRIVE_CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbxHp7xV95nOyhVEkBrBF-Ic_TRPIic2p5sByh8HqJtuA-3ina6W9V1LeqBqmEXuJ3UB/exec',
  token:    'CombusAri#@26'
};

/* ========== ESTADO ========== */
const state = {
  cnpj:'', razao:'', fantasia:'', cidade:'', uf:'',
  diesel:0, arla:0, prazo:0
};

/* ========== NAVEGAÇÃO ========== */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }
function goForm(){ show('form'); setTimeout(()=>document.getElementById('fCnpj').focus(), 60); }
function goCover(){ show('cover'); }

/* ========== HELPERS ========== */
function busy(on, msg){ document.getElementById('ovlMsg').textContent = msg||'Carregando…'; document.getElementById('ovl').classList.toggle('on', !!on); }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('err',!!err); t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), 2600); }

/* ========== CNPJ ========== */
function maskCnpj(s){
  s=(s||'').replace(/\D/g,'').slice(0,14);
  const a=s.length;
  if(a<=2)   return s;
  if(a<=5)   return s.slice(0,2)+'.'+s.slice(2);
  if(a<=8)   return s.slice(0,2)+'.'+s.slice(2,5)+'.'+s.slice(5);
  if(a<=12)  return s.slice(0,2)+'.'+s.slice(2,5)+'.'+s.slice(5,8)+'/'+s.slice(8);
  return s.slice(0,2)+'.'+s.slice(2,5)+'.'+s.slice(5,8)+'/'+s.slice(8,12)+'-'+s.slice(12);
}
function validCnpj(cnpj){
  cnpj=(cnpj||'').replace(/\D/g,'');
  if(cnpj.length!==14) return false;
  if(/^(\d)\1+$/.test(cnpj)) return false;
  const calc=(base)=>{
    const pesos = base.length===12
      ? [5,4,3,2,9,8,7,6,5,4,3,2]
      : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    let sum=0; for(let i=0;i<base.length;i++) sum += parseInt(base[i],10)*pesos[i];
    const r=sum%11; return r<2?0:11-r;
  };
  const d1=calc(cnpj.slice(0,12));
  const d2=calc(cnpj.slice(0,12)+d1);
  return d1===parseInt(cnpj[12],10) && d2===parseInt(cnpj[13],10);
}
let cnpjTimer=null;
function onCnpjInput(el){
  el.value = maskCnpj(el.value);
  const digits = el.value.replace(/\D/g,'');
  const hint = document.getElementById('cnpjHint');
  const info = document.getElementById('cnpjInfo');
  hint.className='hint'; info.className='cnpj-info';
  if(digits.length < 14){
    hint.textContent = `${digits.length}/14`;
    info.classList.remove('on'); info.innerHTML=''; state.cnpj='';
    return;
  }
  if(!validCnpj(digits)){
    hint.textContent = 'CNPJ inválido.'; hint.classList.add('err');
    info.classList.remove('on'); state.cnpj='';
    return;
  }
  hint.textContent='CNPJ válido.'; hint.classList.add('ok');
  clearTimeout(cnpjTimer);
  cnpjTimer = setTimeout(()=>buscarCnpj(digits), 200);
}
function onCnpjBlur(){
  const el=document.getElementById('fCnpj');
  const digits = el.value.replace(/\D/g,'');
  if(digits.length===14 && validCnpj(digits) && state.cnpj!==digits) buscarCnpj(digits);
}
async function buscarCnpj(digits){
  const info = document.getElementById('cnpjInfo');
  info.className='cnpj-info on loading'; info.textContent='Buscando dados na Receita…';
  try{
    const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${digits}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    state.cnpj = digits;
    state.razao = (d.razao_social || '').trim();
    state.fantasia = (d.nome_fantasia || '').trim();
    state.cidade = (d.municipio || '').trim();
    state.uf = (d.uf || '').trim();
    const nome = state.fantasia || state.razao;
    info.className='cnpj-info on';
    info.innerHTML = `
      <div class="rz">${escapeHtml(nome)}</div>
      ${state.fantasia && state.razao && state.fantasia!==state.razao ? `<div class="fa">${escapeHtml(state.razao)}</div>` : ''}
      <div class="loc">📍 ${escapeHtml(state.cidade)} / ${escapeHtml(state.uf)}</div>`;
  }catch(e){
    info.className='cnpj-info on err';
    info.textContent = 'Não consegui buscar o CNPJ agora. Verifique a internet ou tente novamente.';
    state.cnpj=''; state.razao=''; state.fantasia=''; state.cidade=''; state.uf='';
  }
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ========== MOEDA BR ========== */
function onMoneyInput(el){
  const digits = (el.value||'').replace(/\D/g,'').replace(/^0+/, '') || '0';
  const n = parseInt(digits,10);
  el.value = (n/100).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
  el.dataset.cents = String(n);
}
function moneyCents(id){ return parseInt(document.getElementById(id).dataset.cents || '0', 10); }
function moneyBr(cents){ return (cents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

/* ========== COLETA ========== */
function coletar(){
  state.diesel = moneyCents('fDiesel');
  state.arla   = moneyCents('fArla');
  state.prazo  = parseInt((document.getElementById('fPrazo').value||'0'),10) || 0;
  return state;
}
function validar(){
  const c = coletar();
  if(!c.cnpj) return 'Informe um CNPJ válido e aguarde a busca dos dados.';
  if(!c.razao) return 'Aguarde os dados da empresa serem carregados.';
  if(c.diesel <= 0) return 'Informe o valor do Diesel.';
  if(c.arla <= 0)   return 'Informe o valor do Arla.';
  if(c.prazo <= 0)  return 'Informe o prazo de pagamento (dias).';
  return null;
}

/* ========== SALVAR (Apps Script → Google Sheets) ========== */
function dataHoraBr(){
  const d=new Date(), z=n=>String(n).padStart(2,'0');
  return `${z(d.getDate())}/${z(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
async function salvarAri(){
  const err = validar();
  if(err){ toast(err, true); return; }
  if(!DRIVE_CONFIG.endpoint){
    toast('Endpoint do Apps Script não configurado.', true);
    alert('Configuração pendente:\n\n1) Publique o Codigo.gs (Apps Script) como App da Web.\n2) Cole a URL /exec em DRIVE_CONFIG.endpoint no index.html.');
    return;
  }
  busy(true, 'Enviando…');
  const payload = JSON.stringify({
    token: DRIVE_CONFIG.token,
    cnpj:     maskCnpj(state.cnpj),
    empresa:  state.fantasia || state.razao,
    razao:    state.razao,
    cidade:   state.cidade,
    uf:       state.uf,
    diesel:   state.diesel/100,
    arla:     state.arla/100,
    prazo:    state.prazo,
    data:     dataHoraBr()
  });
  try{
    const r = await fetch(DRIVE_CONFIG.endpoint, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: payload
    });
    let out=null; try{ out=await r.json(); }catch(_){}
    busy(false);
    if(out && out.ok){ toast('Salvo com sucesso ✓'); }
    else if(out && out.erro){ toast('Erro: '+out.erro, true); }
    else if(r.ok){ toast('Salvo com sucesso ✓'); }
    else { toast('Falha ao salvar (HTTP '+r.status+').', true); }
  }catch(e){
    busy(false);
    toast('Sem conexão. Tente novamente.', true);
  }
}

/* ========== PDF (jsPDF) ========== */
function buildPdf(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert('Erro: biblioteca de PDF não carregada.'); return null; }
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit:'pt', format:'a4', compress:true});
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const M = 42;

  /* header — faixa laranja com logo */
  pdf.setFillColor(255, 107, 26);
  pdf.rect(0, 0, pw, 96, 'F');

  const logo = document.getElementById('coverLogo');
  try{
    if(logo && logo.complete && logo.naturalWidth){
      const canvas = document.createElement('canvas');
      canvas.width = logo.naturalWidth; canvas.height = logo.naturalHeight;
      canvas.getContext('2d').drawImage(logo, 0, 0);
      const uri = canvas.toDataURL('image/png');
      const lw = 150, lh = lw * logo.naturalHeight / logo.naturalWidth;
      pdf.addImage(uri, 'PNG', M, (96-lh)/2, lw, lh);
    }
  }catch(e){}

  pdf.setFont('helvetica','bold'); pdf.setFontSize(18); pdf.setTextColor(255,255,255);
  pdf.text('PREÇO DO COMBUSTÍVEL', pw - M, 44, {align:'right'});
  pdf.setFontSize(11); pdf.setFont('helvetica','normal');
  pdf.text('Transportes ARI', pw - M, 66, {align:'right'});

  /* corpo */
  let y = 96 + 40;
  pdf.setTextColor(20);

  function row(label, value, big){
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(120);
    pdf.text(String(label).toUpperCase(), M, y);
    y += 14;
    pdf.setFont('helvetica', big ? 'bold' : 'normal'); pdf.setFontSize(big ? 20 : 14); pdf.setTextColor(20);
    const lines = pdf.splitTextToSize(String(value||'-'), pw - M*2);
    pdf.text(lines, M, y);
    y += (big ? 26 : 18) + (lines.length-1) * (big ? 22 : 16);
    y += 8;
    pdf.setDrawColor(230); pdf.line(M, y, pw - M, y);
    y += 16;
  }

  row('CNPJ', maskCnpj(state.cnpj));
  row('Empresa', state.fantasia || state.razao);
  if(state.fantasia && state.razao && state.fantasia !== state.razao) row('Razão Social', state.razao);
  row('Cidade / UF', `${state.cidade} / ${state.uf}`);

  /* destaque valores */
  pdf.setFillColor(250, 245, 235);
  pdf.roundedRect(M, y, pw - M*2, 108, 10, 10, 'F');
  const cx = M + 20; let vy = y + 24;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(120);
  pdf.text('VALOR DO DIESEL', cx, vy); vy += 18;
  pdf.setFontSize(22); pdf.setTextColor(255,107,26);
  pdf.text(moneyBr(state.diesel), cx, vy); vy += 24;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(120);
  pdf.text('VALOR DO ARLA', cx, vy); vy += 18;
  pdf.setFontSize(22); pdf.setTextColor(255,107,26);
  pdf.text(moneyBr(state.arla), cx, vy);
  y += 108 + 20;

  row('Prazo de Pagamento', `${state.prazo} dias`);

  /* rodapé */
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(120);
  pdf.text(`Registrado em ${dataHoraBr()}`, M, ph - 30);
  pdf.text('Transportes ARI', pw - M, ph - 30, {align:'right'});

  return pdf;
}
function pdfFilename(){
  const empresa = (state.fantasia || state.razao || 'empresa')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,30).toUpperCase();
  const d = new Date(), z=n=>String(n).padStart(2,'0');
  return `PRECO-COMBUSTIVEL_${empresa}_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}.pdf`;
}

/* ========== COMPARTILHAR ========== */
async function compartilharWhats(){
  const err = validar();
  if(err){ toast(err, true); return; }
  busy(true, 'Gerando PDF…');
  const pdf = buildPdf();
  if(!pdf){ busy(false); return; }
  const blob = pdf.output('blob');
  const filename = pdfFilename();
  const file = new File([blob], filename, {type:'application/pdf'});
  const text = `Preço do Combustível — ${state.fantasia || state.razao}\nDiesel: ${moneyBr(state.diesel)}\nArla: ${moneyBr(state.arla)}\nPrazo: ${state.prazo} dias`;
  busy(false);

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text, title:'Preço do Combustível — ARI'}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  /* fallback: baixa e abre wa.me */
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  setTimeout(()=>window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank'), 300);
}
</script>
